# Continuous integration: GitHub runs this on every push and pull request, so a
# change that breaks the test suite is caught before it reaches main rather than
# the next time someone happens to run pytest locally.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Check the evidence register is in step with its source
        # SOURCES.md is generated from evidence.db. If someone edits the store
        # without regenerating, the committed register silently misstates what
        # the model is running on.
        run: |
          python research/ingest.py report
          git diff --exit-code research/SOURCES.md
