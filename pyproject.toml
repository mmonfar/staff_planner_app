[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "staff-planner-app"
version = "0.1.0"
description = "Interactive workforce planning app comparing staffing models"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.57.0",
    "matplotlib==3.11.1",
    "pandas==3.0.5",
    "pulp==3.3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["styles.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
